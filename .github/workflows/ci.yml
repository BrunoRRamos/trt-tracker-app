name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: Testes do TRTCore
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Selecionar o Xcode estável mais recente
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      # Regras de cálculo, agenda, projeções, catálogo e modelo de cinética (XCTest, no macOS).
      - name: swift test
        run: swift test --package-path Packages/TRTCore

  app-build:
    name: Build do app (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Selecionar o Xcode estável mais recente
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # Garante que o app compila; sem assinatura, para rodar sem certificados.
      - name: xcodebuild build
        run: |
          xcodebuild build \
            -project TRTTracker.xcodeproj \
            -scheme TRTTracker \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
